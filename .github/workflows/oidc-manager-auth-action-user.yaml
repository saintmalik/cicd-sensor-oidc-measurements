# Normal-user Action path for Manager OIDC auth.
#
# Product under test:
#   - saintmalik/cicd-sensor-action@<sha> with manager-auth: oidc
#   - saintmalik/cicd-sensor Agent/Manager preview release (releases/v0.0.99)
#
# Topology: colocated Manager in the same job (operator setup), then CI-user
# steps are only the Action + real work (including optional long remint).

name: OIDC Action User Path

on:
  workflow_dispatch:
    inputs:
      remint_sleep_seconds:
        description: "Mid-job sleep so ID token can expire before project result (default 330)"
        required: false
        default: "330"

permissions:
  id-token: write
  contents: read

env:
  MANAGER_URL: http://127.0.0.1:18080
  # saintmalik/cicd-sensor-action@feat/manager-auth-oidc — v0.0.0-oidc.1
  ACTION_REF: e1d4fb3fa3a514ef151dcccfbd0c0f4c28509e7c

jobs:
  user-path:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Operator — download OIDC Manager binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-action-user/bin
          curl -fsSL -o /tmp/oidc-action-user/cs.tgz \
            "https://github.com/saintmalik/cicd-sensor/releases/download/releases/v0.0.99/cicd-sensor_0.0.99_linux_amd64.tar.gz"
          tar xzf /tmp/oidc-action-user/cs.tgz -C /tmp/oidc-action-user/bin
          test -x /tmp/oidc-action-user/bin/cicd-sensor-manager-linux-amd64
          echo "Manager binary ready"

      - name: Operator — write Manager OIDC allowlist config
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import os, pathlib, textwrap
          audience = "http://127.0.0.1:18080"
          repo = os.environ["REPO"]
          owner = os.environ["OWNER"]
          cfg = textwrap.dedent(f"""\
          bind:
            address: 127.0.0.1
            port: 18080
          disable_baseline_rules: true
          monitor_mode: true
          redact_process_args: true
          auth:
            oidc:
              enabled: true
              issuer: https://token.actions.githubusercontent.com
              audience: {audience}
              jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks
              allow:
                - repository: {repo}
                  repository_owner: {owner}
          """)
          out = pathlib.Path("/tmp/oidc-action-user")
          out.mkdir(parents=True, exist_ok=True)
          (out / "manager.yaml").write_text(cfg)
          (out / "rules.yaml").write_text("rule_sets: []\n")
          print(cfg)
          PY

      - name: Operator — start colocated Manager
        run: |
          set -euo pipefail
          /tmp/oidc-action-user/bin/cicd-sensor-manager-linux-amd64 \
            --config-file /tmp/oidc-action-user/manager.yaml \
            --rules-file /tmp/oidc-action-user/rules.yaml \
            > /tmp/oidc-action-user/manager.log 2>&1 &
          echo $! > /tmp/oidc-action-user/manager.pid
          for i in $(seq 1 40); do
            if grep -qE 'listening|serve|started|addr' /tmp/oidc-action-user/manager.log 2>/dev/null; then
              echo "Manager log shows activity"
              break
            fi
            if kill -0 "$(cat /tmp/oidc-action-user/manager.pid)" 2>/dev/null; then
              if [ "$i" -ge 8 ]; then
                echo "Manager process up"
                break
              fi
            fi
            sleep 0.25
          done
          kill -0 "$(cat /tmp/oidc-action-user/manager.pid)"
          echo "MANAGER_URL=${MANAGER_URL}" >> "$GITHUB_ENV"

      # ----- CI user path (normal Action shape) -----
      - name: User — cicd-sensor Action (manager-auth oidc)
        uses: saintmalik/cicd-sensor-action@e1d4fb3fa3a514ef151dcccfbd0c0f4c28509e7c # v0.0.0-oidc.1
        with:
          manager-url: http://127.0.0.1:18080
          manager-auth: oidc
          cicd-sensor-version: v0.0.99
          release-repository: saintmalik/cicd-sensor
          enable-html-report: "false"
          enable-attestation-artifact: "false"
          enable-debug: "true"

      - name: User — real work (incl. remint window)
        env:
          SLEEP_S: ${{ inputs.remint_sleep_seconds }}
        run: |
          set -euo pipefail
          echo "hello from normal CI user work"
          uname -a
          if [ -n "${SLEEP_S}" ] && [ "${SLEEP_S}" != "0" ]; then
            echo "sleeping ${SLEEP_S}s for remint window"
            sleep "${SLEEP_S}"
          else
            echo "remint sleep skipped"
          fi
          echo "work done"

      - name: Summarize
        if: always()
        run: |
          {
            echo '## OIDC Action User Path'
            echo
            echo '- Action pin: `saintmalik/cicd-sensor-action@e1d4fb3fa3a514ef151dcccfbd0c0f4c28509e7c` (v0.0.0-oidc.1)'
            echo '- Agent/Manager: `saintmalik/cicd-sensor` `releases/v0.0.99`'
            echo '- manager-auth: oidc'
            echo "- remint_sleep_seconds: ${{ inputs.remint_sleep_seconds }}"
            echo
            echo '### Manager log (tail)'
            echo '```'
            tail -n 80 /tmp/oidc-action-user/manager.log 2>/dev/null || echo '(missing)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload operator logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-action-user-manager-log
          path: |
            /tmp/oidc-action-user/manager.log
            /tmp/oidc-action-user/manager.yaml
          if-no-files-found: warn

      - name: Operator — stop Manager
        if: always()
        run: |
          if [ -f /tmp/oidc-action-user/manager.pid ]; then
            kill "$(cat /tmp/oidc-action-user/manager.pid)" 2>/dev/null || true
          fi
