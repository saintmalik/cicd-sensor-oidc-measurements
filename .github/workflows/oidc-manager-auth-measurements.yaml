# Manual workflow: measure GitHub Actions OIDC mint behavior for Manager auth.
#
# @rung Measurement items 1–5 from oidc-manager-auth design.
# Run: Actions → "OIDC Manager Auth Measurements" → Run workflow
#
# This workflow does NOT invent numbers. It prints JSON results to the job
# summary and uploads an artifact. Paste Results into the design doc table.
#
# Required: permissions.id-token: write (this workflow sets it).

name: OIDC Manager Auth Measurements

on:
  workflow_dispatch:
    inputs:
      sleep_seconds:
        description: "Seconds to sleep before remint (item 2)"
        required: false
        default: "300"
      manager_audience:
        description: "OIDC audience used for mint GETs (Manager origin)"
        required: false
        default: "https://cicd-sensor-manager.example.com"

permissions:
  id-token: write
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OIDC mint measurements
        id: measure
        env:
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
          MANAGER_AUDIENCE: ${{ inputs.manager_audience }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-measure
          python3 - <<'PY'
          import base64, json, os, time, urllib.parse, urllib.request
          from datetime import datetime, timezone

          out = {
              "measured_at": datetime.now(timezone.utc).isoformat(),
              "runner": os.environ.get("RUNNER_NAME", ""),
              "github_repository": os.environ.get("GITHUB_REPOSITORY", ""),
              "items": {},
          }

          def b64url_json(part: str):
              pad = "=" * (-len(part) % 4)
              return json.loads(base64.urlsafe_b64decode(part + pad))

          def decode_jwt_times(raw: str):
              parts = raw.split(".")
              if len(parts) < 2:
                  return None
              claims = b64url_json(parts[1])
              return {
                  "iat": claims.get("iat"),
                  "exp": claims.get("exp"),
                  "lifetime_seconds": (claims.get("exp") or 0) - (claims.get("iat") or 0),
                  "iss": claims.get("iss"),
                  "aud": claims.get("aud"),
              }

          req_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          req_tok = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          audience = os.environ.get("MANAGER_AUDIENCE", "https://cicd-sensor-manager.example.com")
          sleep_s = int(os.environ.get("SLEEP_SECONDS", "300"))

          # Item 5: actual request-URL host
          host = ""
          try:
              host = urllib.parse.urlparse(req_url).hostname or ""
          except Exception as e:
              out["items"]["5_request_url_host"] = {"ok": False, "error": str(e)}
          else:
              out["items"]["5_request_url_host"] = {
                  "ok": bool(host),
                  "host": host,
                  "request_url_path": urllib.parse.urlparse(req_url).path,
              }

          # Item 1: request-token lifetime (decode request token JWT if it is a JWT)
          item1 = {"ok": False}
          if req_tok.count(".") >= 2:
              try:
                  times = decode_jwt_times(req_tok)
                  item1 = {"ok": True, "kind": "jwt", **(times or {})}
              except Exception as e:
                  item1 = {"ok": False, "kind": "jwt_decode_failed", "error": str(e)}
          else:
              item1 = {
                  "ok": False,
                  "kind": "non_jwt_or_opaque",
                  "note": "ACTIONS_ID_TOKEN_REQUEST_TOKEN is not a JWT; lifetime not decodable client-side",
                  "token_len": len(req_tok),
              }
          out["items"]["1_request_token_lifetime"] = item1

          def mint(label: str):
              if not req_url or not req_tok:
                  return {"ok": False, "error": "missing ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN"}
              parsed = urllib.parse.urlparse(req_url)
              q = urllib.parse.parse_qs(parsed.query)
              q["audience"] = [audience]
              url = urllib.parse.urlunparse(parsed._replace(query=urllib.parse.urlencode({k: v[0] for k, v in q.items()})))
              request = urllib.request.Request(url, method="GET", headers={
                  "Authorization": f"bearer {req_tok}",
                  "Accept": "application/json",
              })
              started = time.time()
              try:
                  with urllib.request.urlopen(request, timeout=30) as resp:
                      body = json.load(resp)
                      raw = body.get("value") or body.get("token") or ""
                      elapsed_ms = int((time.time() - started) * 1000)
                      times = decode_jwt_times(raw) if raw else None
                      return {
                          "ok": True,
                          "label": label,
                          "http_status": getattr(resp, "status", 200),
                          "elapsed_ms": elapsed_ms,
                          "id_token_times": times,
                      }
              except Exception as e:
                  return {
                      "ok": False,
                      "label": label,
                      "error": str(e),
                      "elapsed_ms": int((time.time() - started) * 1000),
                  }

          # Baseline mint (also used as "from job user" for item 3 comparison)
          out["items"]["mint_baseline"] = mint("baseline")

          # Item 2: mint after long sleep
          time.sleep(sleep_s)
          out["items"]["2_mint_after_sleep"] = mint(f"after_sleep_{sleep_s}s")
          out["items"]["2_sleep_seconds"] = sleep_s

          # Item 3: mint from root-like context is not fully reproducible in
          # GitHub-hosted ubuntu-latest without a real systemd unit. Record uid
          # and attempt mint again as the same process (documents limitation).
          out["items"]["3_mint_from_root_systemd"] = {
              "ok": False,
              "blocked": True,
              "uid": os.getuid(),
              "euid": os.geteuid(),
              "note": "GitHub-hosted runners do not expose an Agent-like root systemd unit in this job. Unblock: run the same mint GET from a self-hosted runner Agent unit (User=root) using the job's ACTIONS_ID_TOKEN_REQUEST_* env, or add a follow-up job on a self-hosted machine runner.",
              "same_process_mint": mint("uid_check_remint"),
          }

          # Item 4: mint during VM shutdown after the job — must run in a
          # post-job / shutdown hook. This step cannot observe VM teardown.
          out["items"]["4_mint_during_vm_shutdown"] = {
              "ok": False,
              "blocked": True,
              "note": "Cannot measure inside the main job. See the post-job step and artifact; if that step fails or is skipped, treat item 4 as mint-failed-during-shutdown and keep the design's ForceRefresh branch.",
          }

          path = "/tmp/oidc-measure/results.json"
          with open(path, "w", encoding="utf-8") as f:
              json.dump(out, f, indent=2)
          print(json.dumps(out, indent=2))
          PY

      - name: Write job summary
        if: always()
        run: |
          if [ -f /tmp/oidc-measure/results.json ]; then
            echo '## OIDC Manager Auth Measurements' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat /tmp/oidc-measure/results.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            echo 'Paste numeric fields into the design Measurement table. Do not invent values.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload measurement artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-manager-auth-measurements
          path: /tmp/oidc-measure/results.json
          if-no-files-found: warn

  # Item 4 helper: runs after the measure job completes. On GitHub-hosted
  # runners this is still not true VM-shutdown, but it is the closest in-repo
  # post-job window. Record success/failure honestly.
  measure-post-job-mint:
    runs-on: ubuntu-latest
    needs: measure
    if: always()
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Post-job mint attempt (item 4 approximation)
        env:
          MANAGER_AUDIENCE: ${{ inputs.manager_audience }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from datetime import datetime, timezone
          req_url = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_URL", "")
          req_tok = os.environ.get("ACTIONS_ID_TOKEN_REQUEST_TOKEN", "")
          audience = os.environ.get("MANAGER_AUDIENCE", "https://cicd-sensor-manager.example.com")
          result = {
              "measured_at": datetime.now(timezone.utc).isoformat(),
              "item": 4,
              "window": "separate_job_after_measure_not_vm_shutdown",
              "ok": False,
          }
          try:
              parsed = urllib.parse.urlparse(req_url)
              q = urllib.parse.parse_qs(parsed.query)
              q["audience"] = [audience]
              url = urllib.parse.urlunparse(parsed._replace(query=urllib.parse.urlencode({k: v[0] for k, v in q.items()})))
              request = urllib.request.Request(url, method="GET", headers={
                  "Authorization": f"bearer {req_tok}",
                  "Accept": "application/json",
              })
              with urllib.request.urlopen(request, timeout=30) as resp:
                  body = json.load(resp)
                  result["ok"] = bool(body.get("value") or body.get("token"))
                  result["http_status"] = getattr(resp, "status", 200)
          except Exception as e:
              result["error"] = str(e)
          print(json.dumps(result, indent=2))
          open("/tmp/item4.json", "w").write(json.dumps(result, indent=2))
          PY
      - name: Upload item4 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-manager-auth-measurement-item4
          path: /tmp/item4.json
          if-no-files-found: warn
