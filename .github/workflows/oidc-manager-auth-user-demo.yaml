# Normal-user style OIDC Manager auth demo on a private self-hosted Linux lab runner.
#
# Operator path: long-lived Manager (systemd) + host Agent (systemd) + moto S3 sink.
# CI user path: id-token: write → project start (oidc) → real work → long remint window
# → project result (ForceRefresh) → verify sink received logs.
#
# Not a unit-test harness. Uses the real cicd-sensor / cicd-sensor-manager binaries.

name: OIDC Manager Auth User Demo

on:
  workflow_dispatch:
    inputs:
      remint_sleep_seconds:
        description: "Sleep mid-job so ID token expires and Agent remints (default 330)"
        required: false
        default: "330"

permissions:
  id-token: write
  contents: read

env:
  GOFLAGS: -mod=vendor
  MANAGER_URL: http://127.0.0.1:18080
  AGENT_SOCKET: /run/cicd-sensor/agent.sock
  DEMO_ROOT: /var/lib/cicd-sensor-oidc-user-demo
  MINIO_ROOT_USER: oidclab
  MINIO_ROOT_PASSWORD: oidclab-demo-secret
  AWS_ACCESS_KEY_ID: oidclab
  AWS_SECRET_ACCESS_KEY: oidclab-demo-secret
  AWS_DEFAULT_REGION: us-east-1
  AWS_ENDPOINT_URL: http://127.0.0.1:9000
  AWS_EC2_METADATA_DISABLED: "true"

jobs:
  user-demo:
    runs-on: [self-hosted, oidc-lab]
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Manager + Agent CLI
        run: |
          set -euo pipefail
          mkdir -p bin /tmp/oidc-user-demo
          sudo mkdir -p "$DEMO_ROOT"
          go build -mod=vendor -o bin/cicd-sensor-manager ./cmd/cicd-sensor-manager
          go build -mod=vendor -o bin/cicd-sensor ./cmd/cicd-sensor
          sudo install -d -m 0755 /opt/cicd-sensor
          sudo install -m 0755 bin/cicd-sensor /opt/cicd-sensor/cicd-sensor
          sudo install -m 0755 bin/cicd-sensor-manager /opt/cicd-sensor/cicd-sensor-manager

      - name: Operator — install S3-compatible sink (moto)
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/oidc-sink-venv/bin/python" ]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3-venv python3-pip
            python3 -m venv "$HOME/oidc-sink-venv"
            "$HOME/oidc-sink-venv/bin/pip" install -q "moto[s3,server]==5.1.1" boto3
          fi
          "$HOME/oidc-sink-venv/bin/python" -c 'import moto, boto3; print("sink deps ok")'

      - name: Operator — start moto S3 sink
        run: |
          set -euo pipefail
          sudo mkdir -p "$DEMO_ROOT/logs"
          sudo tee /etc/systemd/system/cicd-sensor-oidc-s3sink.service >/dev/null <<EOF
          [Unit]
          Description=cicd-sensor OIDC lab S3 sink (moto)
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=$(whoami)
          WorkingDirectory=$HOME
          ExecStart=$HOME/oidc-sink-venv/bin/python -m moto.server -H 127.0.0.1 -p 9000
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart cicd-sensor-oidc-s3sink.service
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:9000/ 2>/dev/null; then
              echo "moto S3 listening"
              break
            fi
            sleep 0.5
          done
          "$HOME/oidc-sink-venv/bin/python" <<'PY'
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="oidclab",
              aws_secret_access_key="oidclab-demo-secret",
              region_name="us-east-1",
          )
          try:
              s3.create_bucket(Bucket="oidc-user-demo")
          except Exception as e:
              if "BucketAlreadyOwnedByYou" not in str(e) and "BucketAlreadyExists" not in str(e):
                  raise
          print("bucket ready:", s3.list_buckets())
          PY

      - name: Operator — write Manager config (OIDC + S3 sink)
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          sudo mkdir -p /etc/cicd-sensor "$DEMO_ROOT"
          python3 <<'PY'
          import os, pathlib, textwrap
          audience = "http://127.0.0.1:18080"
          repo = os.environ["REPO"]
          owner = os.environ["OWNER"]
          cfg = textwrap.dedent(f"""\
          bind:
            address: 127.0.0.1
            port: 18080
          disable_baseline_rules: true
          monitor_mode: true
          redact_process_args: true
          auth:
            oidc:
              enabled: true
              issuer: https://token.actions.githubusercontent.com
              audience: {audience}
              jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks
              allow:
                - repository: {repo}
                  repository_owner: {owner}
          sinks:
            lab-s3:
              type: aws_s3
              uri: s3://oidc-user-demo/logs/
              region: us-east-1
              use_path_style: true
          logs:
            summary:
              sink: lab-s3
            detection:
              sink: lab-s3
            runtime_event:
              sink: lab-s3
          """)
          pathlib.Path("/tmp/oidc-user-demo/manager.yaml").write_text(cfg)
          pathlib.Path("/tmp/oidc-user-demo/rules.yaml").write_text("rule_sets: []\n")
          print(cfg)
          PY
          sudo install -m 0644 /tmp/oidc-user-demo/manager.yaml /etc/cicd-sensor/manager-oidc-user-demo.yaml
          sudo install -m 0644 /tmp/oidc-user-demo/rules.yaml /etc/cicd-sensor/rules-oidc-user-demo.yaml

      - name: Operator — start Manager as systemd service
        run: |
          set -euo pipefail
          sudo tee /etc/systemd/system/cicd-sensor-manager-oidc-lab.service >/dev/null <<EOF
          [Unit]
          Description=cicd-sensor Manager (OIDC lab)
          After=network-online.target cicd-sensor-oidc-s3sink.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          Environment=AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
          Environment=AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
          Environment=AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
          Environment=AWS_ENDPOINT_URL=${AWS_ENDPOINT_URL}
          Environment=AWS_ENDPOINT_URL_S3=${AWS_ENDPOINT_URL}
          Environment=AWS_EC2_METADATA_DISABLED=true
          ExecStart=/opt/cicd-sensor/cicd-sensor-manager --config-file /etc/cicd-sensor/manager-oidc-user-demo.yaml --rules-file /etc/cicd-sensor/rules-oidc-user-demo.yaml
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart cicd-sensor-manager-oidc-lab.service
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/ 2>/dev/null | grep -qE '^[0-9]+$'; then
              echo "Manager listening"
              break
            fi
            # Connect RPC may not answer GET / — just check process
            if systemctl is-active --quiet cicd-sensor-manager-oidc-lab.service; then
              sleep 1
              if [ "$i" -ge 5 ]; then
                echo "Manager service active"
                break
              fi
            fi
            sleep 1
          done
          systemctl is-active cicd-sensor-manager-oidc-lab.service
          sudo journalctl -u cicd-sensor-manager-oidc-lab.service -n 30 --no-pager -o cat 2>&1 | sed "s/vm-[a-z0-9-]*/lab-runner/gi" || true

      - name: Operator — start host Agent as systemd service
        run: |
          set -euo pipefail
          sudo mkdir -p /run/cicd-sensor
          sudo tee /etc/systemd/system/cicd-sensor-agent-oidc-lab.service >/dev/null <<EOF
          [Unit]
          Description=cicd-sensor Agent (OIDC lab)
          After=network-online.target cicd-sensor-manager-oidc-lab.service
          Wants=network-online.target

          [Service]
          Type=simple
          User=root
          ExecStart=/opt/cicd-sensor/cicd-sensor agent start --provider github --runner machine --socket ${AGENT_SOCKET} --id-token-request-url-hosts '*.actions.githubusercontent.com'
          Restart=on-failure

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo systemctl daemon-reload
          sudo systemctl restart cicd-sensor-agent-oidc-lab.service
          ok=0
          for i in $(seq 1 40); do
            if [ -S "$AGENT_SOCKET" ]; then ok=1; break; fi
            if ! systemctl is-active --quiet cicd-sensor-agent-oidc-lab.service; then
              sudo journalctl -u cicd-sensor-agent-oidc-lab.service -n 80 --no-pager -o cat 2>&1 | sed "s/vm-[a-z0-9-]*/lab-runner/gi" || true
              break
            fi
            sleep 0.5
          done
          if [ "$ok" != 1 ]; then
            echo "Agent socket did not appear" >&2
            sudo journalctl -u cicd-sensor-agent-oidc-lab.service -n 120 --no-pager -o cat 2>&1 | sed "s/vm-[a-z0-9-]*/lab-runner/gi" || true
            exit 1
          fi
          echo "Agent socket ready: $AGENT_SOCKET"
          sudo journalctl -u cicd-sensor-agent-oidc-lab.service -n 20 --no-pager -o cat 2>&1 | sed "s/vm-[a-z0-9-]*/lab-runner/gi" || true

      - name: CI user — project start (manager-auth oidc)
        id: project_start
        run: |
          set -euo pipefail
          /opt/cicd-sensor/cicd-sensor project start \
            --socket "$AGENT_SOCKET" \
            --manager-url "$MANAGER_URL" \
            --manager-auth oidc \
            --id-token-audience "$MANAGER_URL" \
            --provider github
          echo "project_start_ok=true" >> "$GITHUB_OUTPUT"
          echo "project start succeeded (OIDC FetchConfig path)"

      - name: CI user — real work (checkout already done; write + tiny build)
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-user-demo/work
          echo "hello from oidc user demo $(date -u +%Y-%m-%dT%H:%M:%SZ)" > /tmp/oidc-user-demo/work/hello.txt
          cat /tmp/oidc-user-demo/work/hello.txt
          # Tiny compile so the job looks like normal CI, not a test harness
          cat > /tmp/oidc-user-demo/work/main.go <<'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("oidc-user-demo-ok") }
          EOF
          go build -o /tmp/oidc-user-demo/work/hello /tmp/oidc-user-demo/work/main.go
          /tmp/oidc-user-demo/work/hello | tee /tmp/oidc-user-demo/work/out.txt
          test "$(cat /tmp/oidc-user-demo/work/out.txt)" = "oidc-user-demo-ok"

      - name: CI user — wait past ID token lifetime (remint window)
        run: |
          set -euo pipefail
          SECS="${{ inputs.remint_sleep_seconds }}"
          echo "Sleeping ${SECS}s so the Actions ID token can expire mid-job; Agent should remint on next Manager call"
          sleep "$SECS"

      - name: CI user — project result (ForceRefresh / shutdown Summary path)
        id: project_result
        run: |
          set -euo pipefail
          /opt/cicd-sensor/cicd-sensor project result \
            --socket "$AGENT_SOCKET" \
            --provider github \
            | tee /tmp/oidc-user-demo/project-result.txt
          echo "project_result_ok=true" >> "$GITHUB_OUTPUT"

      - name: Verify Manager sink received logs
        id: sink
        run: |
          set -euo pipefail
          sleep 3
          "$HOME/oidc-sink-venv/bin/python" <<'PY'
          import json, pathlib
          import boto3
          s3 = boto3.client(
              "s3",
              endpoint_url="http://127.0.0.1:9000",
              aws_access_key_id="oidclab",
              aws_secret_access_key="oidclab-demo-secret",
              region_name="us-east-1",
          )
          keys = []
          token = None
          while True:
              kwargs = {"Bucket": "oidc-user-demo"}
              if token:
                  kwargs["ContinuationToken"] = token
              resp = s3.list_objects_v2(**kwargs)
              for obj in resp.get("Contents") or []:
                  keys.append(obj["Key"])
              if not resp.get("IsTruncated"):
                  break
              token = resp.get("NextContinuationToken")
          listing = "\n".join(keys) if keys else "(none)"
          pathlib.Path("/tmp/oidc-user-demo/sink-ls.txt").write_text(listing + "\n")
          out = {
              "ok": len(keys) > 0,
              "sink_object_count": len(keys),
              "manager_url": "http://127.0.0.1:18080",
              "auth": "oidc",
              "note": "moto S3-compatible sink behind Manager; objects prove IngestLog after project result",
              "keys_sample": keys[:20],
          }
          pathlib.Path("/tmp/oidc-user-demo/sink-verify.json").write_text(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          print(listing)
          if not keys:
              raise SystemExit("expected at least one object in Manager sink after project result")
          PY
          count=$(python3 -c 'import json; print(json.load(open("/tmp/oidc-user-demo/sink-verify.json"))["sink_object_count"])')
          echo "sink_object_count=${count}" >> "$GITHUB_OUTPUT"

      - name: Write demo summary
        if: always()
        run: |
          {
            echo '## OIDC Manager Auth — user demo'
            echo
            echo '- Manager: systemd service on lab runner (real GitHub JWKS + repo allowlist)'
            echo '- Agent: systemd host Agent on lab runner'
            echo '- CI: `project start --manager-auth oidc` → real work → remint sleep → `project result`'
            echo '- Sink: moto S3-compatible store via Manager'
            echo
            echo '### Sink verify'
            echo '```json'
            cat /tmp/oidc-user-demo/sink-verify.json 2>/dev/null || echo '{}'
            echo '```'
            echo
            echo '### Sink listing'
            echo '```'
            cat /tmp/oidc-user-demo/sink-ls.txt 2>/dev/null || echo '(none)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload demo artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oidc-user-demo
          path: |
            /tmp/oidc-user-demo/
            !/tmp/oidc-user-demo/minio-data/**
          if-no-files-found: warn

      - name: Operator — tear down lab services
        if: always()
        run: |
          set +e
          sudo systemctl stop cicd-sensor-agent-oidc-lab.service
          sudo systemctl stop cicd-sensor-manager-oidc-lab.service
          sudo systemctl stop cicd-sensor-oidc-s3sink.service
          sudo systemctl disable cicd-sensor-agent-oidc-lab.service cicd-sensor-manager-oidc-lab.service cicd-sensor-oidc-s3sink.service 2>/dev/null
          sudo rm -f /etc/systemd/system/cicd-sensor-agent-oidc-lab.service \
            /etc/systemd/system/cicd-sensor-manager-oidc-lab.service \
            /etc/systemd/system/cicd-sensor-oidc-s3sink.service \
            /etc/systemd/system/cicd-sensor-oidc-minio.service
          sudo systemctl daemon-reload
          echo "lab services stopped"
