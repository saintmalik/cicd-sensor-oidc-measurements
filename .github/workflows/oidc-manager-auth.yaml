# OIDC Manager Auth — Action user path + mint probes + GH-hosted teardown mint (#4).
#
# Product under test (action-user):
#   - saintmalik/cicd-sensor-action@<full-sha> # v0.0.0-oidc.1 (manager-auth: oidc)
#   - saintmalik/cicd-sensor Agent/Manager preview release (releases/v0.0.99)
#
# mint-probes: request-token lifetime, remint after sleep, request-URL host.
# teardown-mint: SIGTERM mint during GitHub-hosted VM teardown (measurement #4).
# lab-root-mint / lab-post-job: self-hosted approximations — NOT measurement #4.
#
# Run: Actions → "OIDC Manager Auth" → Run workflow

name: OIDC Manager Auth

on:
  workflow_dispatch:
    inputs:
      remint_sleep_seconds:
        description: "Mid-job sleep so the Agent can remint after ID token expiry (default 330; 0 skips)"
        required: false
        default: "330"
      mint_sleep_seconds:
        description: "mint-probes sleep before remint (default 300; 0 skips remint)"
        required: false
        default: "300"
      run_lab_root_mint:
        description: "Also run lab-root-mint on self-hosted oidc-lab"
        type: boolean
        required: false
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  action-user:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MANAGER_URL: http://127.0.0.1:18080
    steps:
      - name: Download Manager binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-lab/bin
          curl -fsSL -o /tmp/oidc-lab/cs.tgz \
            "https://github.com/saintmalik/cicd-sensor/releases/download/releases/v0.0.99/cicd-sensor_0.0.99_linux_amd64.tar.gz"
          tar xzf /tmp/oidc-lab/cs.tgz -C /tmp/oidc-lab/bin
          test -x /tmp/oidc-lab/bin/cicd-sensor-manager-linux-amd64

      - name: Write Manager OIDC config
        env:
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          cat > /tmp/oidc-lab/manager.yaml <<EOF
          bind:
            address: 127.0.0.1
            port: 18080
          disable_baseline_rules: true
          monitor_mode: true
          redact_process_args: true
          auth:
            oidc:
              enabled: true
              issuer: https://token.actions.githubusercontent.com
              audience: http://127.0.0.1:18080
              jwks_url: https://token.actions.githubusercontent.com/.well-known/jwks
              allow:
                - repository: ${REPO}
                  repository_owner: ${OWNER}
          EOF
          echo 'rule_sets: []' > /tmp/oidc-lab/rules.yaml

      - name: Start Manager
        run: |
          set -euo pipefail
          /tmp/oidc-lab/bin/cicd-sensor-manager-linux-amd64 \
            --config-file /tmp/oidc-lab/manager.yaml \
            --rules-file /tmp/oidc-lab/rules.yaml \
            > /tmp/oidc-lab/manager.log 2>&1 &
          echo $! > /tmp/oidc-lab/manager.pid
          for i in $(seq 1 40); do
            if kill -0 "$(cat /tmp/oidc-lab/manager.pid)" 2>/dev/null && [ "$i" -ge 8 ]; then
              break
            fi
            sleep 0.25
          done
          kill -0 "$(cat /tmp/oidc-lab/manager.pid)"

      - name: cicd-sensor Action
        uses: saintmalik/cicd-sensor-action@e1d4fb3fa3a514ef151dcccfbd0c0f4c28509e7c # v0.0.0-oidc.1
        with:
          manager-url: http://127.0.0.1:18080
          manager-auth: oidc
          cicd-sensor-version: v0.0.99
          release-repository: saintmalik/cicd-sensor
          enable-html-report: "false"
          enable-attestation-artifact: "false"
          enable-debug: "true"

      - name: Work
        env:
          SLEEP_S: ${{ inputs.remint_sleep_seconds }}
        run: |
          set -euo pipefail
          echo work
          if [ -n "${SLEEP_S}" ] && [ "${SLEEP_S}" != "0" ]; then
            echo "sleeping ${SLEEP_S}s for remint window"
            sleep "${SLEEP_S}"
            echo work after remint window
          fi

      - name: Upload Manager log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-manager-auth-manager-log
          path: |
            /tmp/oidc-lab/manager.log
            /tmp/oidc-lab/manager.yaml
          if-no-files-found: warn

      - name: Stop Manager
        if: always()
        run: |
          if [ -f /tmp/oidc-lab/manager.pid ]; then
            kill "$(cat /tmp/oidc-lab/manager.pid)" 2>/dev/null || true
          fi

  mint-probes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run mint probes
        env:
          SLEEP_SECONDS: ${{ inputs.mint_sleep_seconds }}
          MANAGER_AUDIENCE: https://cicd-sensor-manager.example.com
          OUT_PATH: /tmp/oidc-mint-probes/results.json
        run: python3 scripts/mint-probes.py

      - name: Job summary
        if: always()
        run: |
          if [ -f /tmp/oidc-mint-probes/results.json ]; then
            {
              echo '## Mint probes'
              echo '```json'
              cat /tmp/oidc-mint-probes/results.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload mint-probes artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-mint-probes
          path: /tmp/oidc-mint-probes/results.json
          if-no-files-found: warn

  # Measurement #4: orphan a SIGTERM-trapping watchdog on ubuntu-latest; on GitHub-hosted
  # VM teardown the runner SIGTERMs remaining processes — mint + POST to external sink.
  teardown-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sink_uuid: ${{ steps.sink.outputs.uuid }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create webhook.site sink
        id: sink
        run: |
          set -euo pipefail
          resp=$(curl -fsS -X POST 'https://webhook.site/token' -H 'Accept: application/json')
          uuid=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["uuid"])' <<<"$resp")
          test -n "$uuid"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          echo "TEARDOWN_SINK_URL=https://webhook.site/${uuid}" >> "$GITHUB_ENV"
          echo "sink uuid=${uuid}"

      - name: Start teardown watchdog (background)
        env:
          MANAGER_AUDIENCE: https://cicd-sensor-manager.example.com
        run: |
          set -euo pipefail
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"
          test -n "${TEARDOWN_SINK_URL:-}"
          # Escape runner orphan SIGKILL (Process.Kill on matching RUNNER_TRACKING_ID)
          # so the process lives until hosted-VM OS teardown delivers SIGTERM.
          env -u RUNNER_TRACKING_ID nohup python3 scripts/teardown-watchdog.py \
            >/tmp/teardown-watchdog.log 2>&1 &
          echo $! > /tmp/teardown-watchdog.pid
          disown "$(cat /tmp/teardown-watchdog.pid)" 2>/dev/null || true
          for i in $(seq 1 20); do
            if kill -0 "$(cat /tmp/teardown-watchdog.pid)" 2>/dev/null; then
              break
            fi
            sleep 0.25
          done
          kill -0 "$(cat /tmp/teardown-watchdog.pid)"
          for i in $(seq 1 30); do
            if curl -fsS "https://webhook.site/token/${{ steps.sink.outputs.uuid }}/requests?sorting=newest&per_page=5" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); sys.exit(0 if any("watchdog_started" in (r.get("content") or "") for r in (d.get("data") or [])) else 1)'; then
              echo "watchdog_started received"
              exit 0
            fi
            sleep 0.5
          done
          echo "watchdog_started not seen; log:" >&2
          cat /tmp/teardown-watchdog.log >&2 || true
          exit 1

      - name: Brief work then exit (normal job completion)
        run: |
          set -euo pipefail
          echo "teardown-mint work; watchdog pid=$(cat /tmp/teardown-watchdog.pid)"
          sleep 3
          echo "exiting normally so GitHub tears down the VM"

  teardown-mint-verify:
    runs-on: ubuntu-latest
    needs: teardown-mint
    if: always() && needs.teardown-mint.result != 'cancelled'
    timeout-minutes: 8
    steps:
      - name: Poll sink for teardown mint payload
        env:
          SINK_UUID: ${{ needs.teardown-mint.outputs.sink_uuid }}
        run: |
          set -euo pipefail
          test -n "${SINK_UUID:-}"
          mkdir -p /tmp/oidc-teardown-mint
          python3 - <<'PY'
          import json, os, sys, time, urllib.request
          from datetime import datetime, timezone

          uuid = os.environ["SINK_UUID"]
          url = f"https://webhook.site/token/{uuid}/requests?sorting=newest&per_page=50"
          # Hosted VM teardown can lag the job-complete event by a bit.
          deadline = time.time() + 180
          found = None
          started = None
          while time.time() < deadline:
              with urllib.request.urlopen(url, timeout=20) as resp:
                  data = json.load(resp)
              for r in data.get("data") or []:
                  raw = r.get("content") or ""
                  try:
                      payload = json.loads(raw)
                  except Exception:
                      continue
                  if payload.get("kind") == "watchdog_started":
                      started = payload
                  if (
                      payload.get("kind") == "teardown_mint"
                      and payload.get("window") == "gh_hosted_vm_teardown_sigterm"
                  ):
                      found = payload
              if found:
                  break
              time.sleep(3)

          out = {
              "measured_at": datetime.now(timezone.utc).isoformat(),
              "item": 4,
              "window": "gh_hosted_vm_teardown_sigterm",
              "sink_uuid": uuid,
              "watchdog_started": started,
              "payload": found,
              "ok": bool(found and found.get("ok") is True),
              "http_status": (found or {}).get("http_status") if found else None,
              "signal": (found or {}).get("signal") if found else None,
              "error": None if found else "no teardown_mint payload within timeout",
          }
          if found and found.get("ok") is not True:
              out["error"] = (found.get("mint") or {}).get("error") or "mint_failed"

          path = "/tmp/oidc-teardown-mint/teardown-mint.json"
          open(path, "w").write(json.dumps(out, indent=2) + "\n")
          print(json.dumps(out, indent=2))
          # Presence of a teardown_mint report is the measurement; mint ok/fail both count.
          sys.exit(0 if found is not None else 1)
          PY

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Measurement #4 — GH-hosted VM teardown mint'
            echo '```json'
            cat /tmp/oidc-teardown-mint/teardown-mint.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload teardown-mint artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-teardown-mint
          path: /tmp/oidc-teardown-mint/
          if-no-files-found: warn

  lab-root-mint:
    runs-on: [self-hosted, oidc-lab]
    continue-on-error: true
    if: ${{ inputs.run_lab_root_mint }}
    timeout-minutes: 15
    steps:
      - name: Persist OIDC request creds for root oneshot
        env:
          MANAGER_AUDIENCE: https://cicd-sensor-manager.example.com
        run: |
          set -euo pipefail
          sudo mkdir -p /run/cicd-sensor-oidc-measure /var/lib/cicd-sensor-oidc-measure
          sudo chmod 0700 /run/cicd-sensor-oidc-measure
          sudo rm -f /var/lib/cicd-sensor-oidc-measure/last-mint.json \
            /var/lib/cicd-sensor-oidc-measure/item4-job-completed.json
          {
            echo "ACTIONS_ID_TOKEN_REQUEST_URL=${ACTIONS_ID_TOKEN_REQUEST_URL}"
            echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN=${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"
            echo "MANAGER_AUDIENCE=${MANAGER_AUDIENCE}"
            echo "OIDC_MEASURE_LABEL=systemd_root_oneshot"
          } | sudo tee /run/cicd-sensor-oidc-measure/job.env >/dev/null
          sudo chmod 0600 /run/cicd-sensor-oidc-measure/job.env
          sudo cp /run/cicd-sensor-oidc-measure/job.env /var/lib/cicd-sensor-oidc-measure/job.env
          sudo chmod 0600 /var/lib/cicd-sensor-oidc-measure/job.env
          test -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}"
          test -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}"

      - name: Mint via systemd User=root oneshot
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-lab-mint
          sudo systemctl reset-failed cicd-sensor-oidc-mint.service 2>/dev/null || true
          systemctl cat cicd-sensor-oidc-mint.service >/dev/null
          sudo systemctl start cicd-sensor-oidc-mint.service
          test -f /var/lib/cicd-sensor-oidc-measure/last-mint.json
          sudo cat /var/lib/cicd-sensor-oidc-measure/last-mint.json > /tmp/oidc-lab-mint/root-mint.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/oidc-lab-mint/root-mint.json"))
          d["host"] = "lab-runner"
          open("/tmp/oidc-lab-mint/root-mint.json", "w").write(json.dumps(d, indent=2) + "\n")
          print(json.dumps(d, indent=2))
          ok = (
              d.get("ok") is True
              and d.get("uid") == 0
              and d.get("euid") == 0
              and d.get("systemd_unit") is True
              and (d.get("mint") or {}).get("http_status") == 200
          )
          sys.exit(0 if ok else 1)
          PY

      - name: Job summary
        if: always()
        run: |
          {
            echo '## Lab root mint'
            echo '```json'
            cat /tmp/oidc-lab-mint/root-mint.json 2>/dev/null || echo '{}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lab-root-mint artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-lab-root-mint
          path: /tmp/oidc-lab-mint/
          if-no-files-found: warn

  # Self-hosted JOB_COMPLETED hook — NOT measurement #4 (GH-hosted VM teardown is teardown-mint).
  lab-post-job:
    runs-on: [self-hosted, oidc-lab]
    needs: lab-root-mint
    if: ${{ always() && inputs.run_lab_root_mint }}
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - name: Collect JOB_COMPLETED hook result
        run: |
          set -euo pipefail
          mkdir -p /tmp/oidc-lab-post
          for i in 1 2 3 4 5 6; do
            [ -f /var/lib/cicd-sensor-oidc-measure/item4-job-completed.json ] && break
            sleep 1
          done
          if [ -f /var/lib/cicd-sensor-oidc-measure/item4-job-completed.json ]; then
            sudo cat /var/lib/cicd-sensor-oidc-measure/item4-job-completed.json \
              > /tmp/oidc-lab-post/job-completed-hook.json
            python3 -c 'import json; p="/tmp/oidc-lab-post/job-completed-hook.json"; d=json.load(open(p)); d["host"]="lab-runner"; open(p,"w").write(json.dumps(d,indent=2)+"\n")'
          else
            echo '{"ok":false,"note":"JOB_COMPLETED hook result not present on runner"}' \
              > /tmp/oidc-lab-post/job-completed-hook.json
          fi
          {
            echo '## Lab post-job hook'
            echo '```json'
            cat /tmp/oidc-lab-post/job-completed-hook.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload lab-post-job artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oidc-lab-post-job
          path: /tmp/oidc-lab-post/
          if-no-files-found: warn
